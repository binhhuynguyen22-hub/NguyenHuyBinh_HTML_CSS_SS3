<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Đăng ký sinh viên mới</h1>
    <form action="">
        <fieldset>
            <label for="userName">Họ và tên</label>
            <input type="text" id="userName" value="Nguyễn Văn An"><br><br>
            <label for="dateOfbirth">Ngày sinh đầy đủ</label>
            <input type="date" value="2005-03-15"><br><br>
            <label for="">Tháng và năm nhập học</label>
            <input type="month" value="2023-09"><br><br>
            <label for="">Thời gian học</label>
            <input type="time" value="08:00"><br><br>
            <label for="">Giới tính</label>
            <input type="radio" name="gender" id="gender">nam
            <input type="radio" name="gender" id="gender">nữ
            <input type="radio" name="gender" id="gender" checked>khác <br><br>
            <label for="">Email sinh viên</label>
            <input type="email" value="sinhvien@university.edu.vn"><br><br>
            <label for="">Mật khẩu</label>
            <input type="password" value="123456789">
        </fieldset>
        <fieldset>
            <div>
                <label for="">Mục tiêu học tập</label>
                <textarea name="" id="" cols="30" rows="5" >Muốn trở thành một lập trình viên giỏi và đóng góp cho xã hội</textarea>
            </div>
            <br>
            <label for="">Cơ sở</label>
            <select name="" id="">
                <option value="">Hà Nội</option>
            </select>
            <br><br>
            <label for="">Ảnh thẻ sinh viên </label>
            <input type="file"><br><br>
            <label for="">Môn học yêu thích</label>
            <input type="checkbox" checked>Toán học<input type="checkbox" checked/> Lập trình
            <input type="checkbox">Tiếng anh<input type="checkbox"/> Vật lý <br><br>
            <label for="">Tiến độ học tập </label>
            <input type="range"> <br><br>
            <label for="">Năm học thứ</label>
            <input type="number" value="2"> <br><br>
            <label for="">Tìm kiếm khóa học</label>
            <input type="search" value="Khoa học máy tính"><br><br>
            <label for="">Màu sắc yêu thích</label>
            <input type="color"><br><br>
            <input type="button" value="Hủy">
            <input type="reset" value="Làm mới">
            <input type="submit" value="Gửi">
        </fieldset>

    </form>
</body>
</html>
