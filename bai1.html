<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Đặt Lịch Tư Vấn Học Tập</h1>
    <form action="">
        <div>
            <label for="userName">Họ và Tên:</label>
            <input type="text" id="userName">
        </div>
        <br>
        <div>
            <label for="dateOfbirth">Chọn ngày giờ:</label>
        <input type="datetime-local" id="dateOfbirth">
        </div>
        <br>
        <div>
            <label for="">Loại dịch vụ:</label>
            <select name="" id="">
                <option value="">Tư vấn học tập</option>
                <option value="">Hướng nghiệp</option>
            </select>
        </div>
        <br>
        <div>
            <label for="">Ghi chú:</label>
            <textarea name="" id="" cols="25" rows="3"></textarea>
        </div>
        <br>
        <input type="button" value="Đặt lịch">
    </form>
</body>
</html>
