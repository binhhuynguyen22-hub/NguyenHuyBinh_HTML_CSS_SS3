<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên</title>
</head>
<body>

<form action="">
    <table cellpadding="6">
        <tr>
            <td>Họ và tên:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Ngày sinh:</td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td>Giới tính:</td>
            <td>
                <input type="radio" name="gender"> Nam
                <input type="radio" name="gender"> Nữ
            </td>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Địa chỉ:</td>
            <td><textarea rows="3" cols="30"></textarea></td>
        </tr>

        <tr>
            <td>Vai trò trong nhóm:</td>
            <td>
                <select>
                    <option>Thành viên</option>
                    <option>Nhóm trưởng</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Sở thích:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Kỹ năng:</td>
            <td><textarea rows="3" cols="30"></textarea></td>
        </tr>

        <tr>
            <td>Thời gian rảnh:</td>
            <td>
                <input type="checkbox"> Sáng
                <input type="checkbox"> Chiều
                <input type="checkbox"> Tối
            </td>
        </tr>

        <tr>
            <td>Lý do tham gia nhóm:</td>
            <td><textarea rows="3" cols="30"></textarea></td>
        </tr>

        <tr>
            <td>Màu yêu thích:</td>
            <td><input type="color"></td>
        </tr>

        <tr>
            <td>Đăng ký nhận bản tin:</td>
            <td><input type="checkbox"> Có</td>
        </tr>

        <tr>
            <td>Nhận thông báo qua:</td>
            <td>
                <input type="radio" name="new"> Email
                <input type="radio" name="new"> SMS
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Đăng ký thành viên">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
