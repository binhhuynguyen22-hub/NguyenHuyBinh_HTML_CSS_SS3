<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Thông Tin</title>
</head>
<body>

<form action="">
    <table cellpadding="6">
        <tr>
            <td>Họ và tên:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Ngày sinh:</td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td>Giới tính:</td>
            <td>
                <input type="radio" name="gender" value="nam"> Nam
                <input type="radio" name="gender" value="nu"> Nữ
            </td>
        </tr>

        <tr>
            <td>Số điện thoại:</td>
            <td><input type="tel"></td>
        </tr>

        <tr>
            <td>Chuyên ngành:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Năm nhập học:</td>
            <td><input type="number" min="1990" max="2025"></td>
        </tr>

        <tr>
            <td>Điểm GPA:</td>
            <td><input type="number" min="0" max="4" step="0.01"></td>
        </tr>

        <tr>
            <td>Địa chỉ:</td>
            <td>
                <textarea cols="25" rows="5"></textarea>
            </td>
        </tr>

        <tr>
            <td>Lớp học:</td>
            <td>
                <select>
                    <option>Lớp 1</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Ngày đăng ký học:</td>
            <td><input type="datetime-local"></td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Gửi thông tin">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
